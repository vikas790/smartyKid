name: smartykids
description: "SmartyKids - Educational app for children"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.2
  lottie: ^2.6.0
  cached_network_image: ^3.4.1
  country_flags: ^4.0.0
  
  # Navigation & Routing
  go_router: ^16.0.0
  
  # State Management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  
  # Dependency Injection
  get_it: ^8.2.0
  
  # Storage & Data
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  
  # Network & API
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  socket_io_client: ^3.1.2
  
  # Utilities
  flutter_dotenv: ^5.2.1
  localization: ^2.1.1
  event_bus: ^2.0.1
  
  # UI Components
  flutter_slider_drawer: ^2.0.0
  animations: ^2.0.11
  fl_chart: ^1.0.0
  
  # Media & Files
  image_picker: ^1.2.0
  
  # Settings
  app_settings: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    # Animations (Lottie files)
    - assets/animations/
    
    # Sounds (Letter pronunciation, music, effects)
    - assets/sounds/
    
    # Drawable resources (images and icons)
    - assets/drawables/icons/
    - assets/drawables/images/
    
    # Language/Country data
    - assets/language/
    - assets/country_dial_info.json

  # Fonts
  fonts:
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/inter_tight/InterTight-Light.ttf
          weight: 300
        - asset: assets/fonts/inter_tight/InterTight-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter_tight/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter_tight/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter_tight/InterTight-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter_tight/InterTight-ExtraBold.ttf
          weight: 800

    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800

    - family: Sacramento
      fonts:
        - asset: assets/fonts/sacramento/Sacramento-Regular.ttf
          weight: 400

    - family: Jost
      fonts:
        - asset: assets/fonts/jost/Jost-Regular.ttf
          weight: 400
        - asset: assets/fonts/jost/Jost-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jost/Jost-Bold.ttf
          weight: 700

    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800


